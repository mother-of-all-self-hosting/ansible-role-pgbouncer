---
# Project source code URL: https://github.com/pgbouncer/pgbouncer

pgbouncer_enabled: true

pgbouncer_identifier: pgbouncer
pgbouncer_base_path: "/{{ pgbouncer_identifier }}"

# renovate: datasource=docker depName=pgbouncer/pgbouncer
pgbouncer_version: 1.25.1

pgbouncer_uid: ""
pgbouncer_gid: ""

pgbouncer_container_image: "{{ pgbouncer_container_image_registry_prefix }}pgbouncer/pgbouncer:{{ pgbouncer_container_image_tag }}"
pgbouncer_container_image_tag: "{{ pgbouncer_version }}"
pgbouncer_container_image_registry_prefix: "{{ pgbouncer_container_image_registry_prefix_upstream }}"
pgbouncer_container_image_registry_prefix_upstream: "{{ pgbouncer_container_image_registry_prefix_upstream_default }}"
pgbouncer_container_image_registry_prefix_upstream_default: docker.io/
# TODO: add tasks to self-build the image

# The base container network. It will be auto-created by this role if it doesn't exist already.
pgbouncer_container_network: "{{ pgbouncer_identifier }}"

# Control if the container network is deleted on uninstalling.
pgbouncer_container_network_deletion_enabled: true

# Specify how the container publishes its HTTP port (as defined by `pgbouncer_container_http_port`).
#
# Takes an "<ip>:<port>" or "<port>" value (e.g. "127.0.0.1:2586"), or empty string to not expose.
pgbouncer_container_http_host_bind_port: ""

# The port number in the container
pgbouncer_container_http_port: 6432

# A list of additional container networks that the container would be connected to.
# The role does not create these networks, so make sure they already exist.
# Use this to expose this container to a reverse proxy, which runs in a different container network.
pgbouncer_container_additional_networks: "{{ pgbouncer_container_additional_networks_auto + pgbouncer_container_additional_networks_custom }}"
pgbouncer_container_additional_networks_auto: []
pgbouncer_container_additional_networks_custom: []

# A list of extra arguments to pass to the process inside the container
# Example: ['--SOME_ARGUMENT']
pgbouncer_process_extra_arguments: "{{ pgbouncer_process_extra_arguments_auto + pgbouncer_process_extra_arguments_custom }}"
pgbouncer_process_extra_arguments_auto: []
pgbouncer_process_extra_arguments_custom: []

# List of systemd services that PgBouncer systemd service depends on
pgbouncer_systemd_required_services_list: "{{ pgbouncer_systemd_required_services_list_default + pgbouncer_systemd_required_services_list_auto + pgbouncer_systemd_required_services_list_custom }}"
pgbouncer_systemd_required_services_list_default: "{{ [devture_systemd_docker_base_docker_service_name] if devture_systemd_docker_base_docker_service_name else [] }}"
pgbouncer_systemd_required_services_list_auto: []
pgbouncer_systemd_required_services_list_custom: []

# List of systemd services that PgBouncer systemd service wants
pgbouncer_systemd_wanted_services_list: "{{ pgbouncer_systemd_wanted_services_list_default + pgbouncer_systemd_wanted_services_list_auto + pgbouncer_systemd_wanted_services_list_custom }}"
pgbouncer_systemd_wanted_services_list_default: []
pgbouncer_systemd_wanted_services_list_auto: []
pgbouncer_systemd_wanted_services_list_custom: []

# Controls how long to wait for the container to stop gracefully before killing it.
pgbouncer_container_stop_grace_time_seconds: "{{ devture_systemd_docker_base_container_stop_grace_time_seconds }}"

# Controls how long the pre-start cleanup should wait for stale container-name release
# before failing startup explicitly.
pgbouncer_container_cleanup_timeout_seconds: "{{ devture_systemd_docker_base_container_cleanup_timeout_seconds }}"

# Controls the delay between pre-start cleanup retries.
pgbouncer_container_cleanup_retry_delay_seconds: "{{ devture_systemd_docker_base_container_cleanup_retry_delay_seconds }}"

# Shell command used in the systemd pre-start phase to deterministically remove a stale
# container and wait until Docker releases its name.
pgbouncer_container_cleanup_command: |
  i=0;
  while [ "$i" -lt {{ pgbouncer_container_cleanup_timeout_seconds }} ]; do
  {{ devture_systemd_docker_base_host_command_docker }} stop -t {{ pgbouncer_container_stop_grace_time_seconds }} {{ pgbouncer_identifier }} >/dev/null 2>&1 || true;
  {{ devture_systemd_docker_base_host_command_docker }} rm -f {{ pgbouncer_identifier }} >/dev/null 2>&1 || true;
  if {{ devture_systemd_docker_base_host_command_docker }} container inspect {{ pgbouncer_identifier }} >/dev/null 2>&1; then
  i=$((i + 1));
  sleep {{ pgbouncer_container_cleanup_retry_delay_seconds }};
  continue;
  fi;
  if {{ devture_systemd_docker_base_host_command_docker }} info >/dev/null 2>&1; then
  exit 0;
  fi;
  echo "Failed to query Docker daemon while cleaning up {{ pgbouncer_identifier }}" >&2;
  exit 1;
  done;
  echo "Failed to remove stale container {{ pgbouncer_identifier }} after {{ pgbouncer_container_cleanup_timeout_seconds }} attempts" >&2;
  exit 1

# Specify the timezone
pgbouncer_environment_variables_tz: UTC

# Additional environment variables.
pgbouncer_environment_variables_additional_variables: ""

# pgbouncer_restart_necessary controls whether PgBouncer systemd
# service will be restarted (when true) or merely started (when false) by the
# systemd service manager role (when conditional restart is enabled).
#
# This value is automatically computed during installation based on whether
# any configuration files, the systemd service file, or the container image changed.
# The default of `false` means "no restart needed" — appropriate when the role's
# installation tasks haven't run (e.g., due to --tags skipping them).
pgbouncer_restart_necessary: false
