---
- name: Perform the standalone Snowflake proxy installation tasks
  when: snowflake_enabled | bool
  tags:
    - setup-all
    - setup-snowflake
    - install-all
    - install-snowflake
  block:
    - name: Validate the standalone Snowflake proxy configuration
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/validate_config.yml"
    - name: Install the standalone Snowflake proxy
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/install.yml"

- name: Perform the standalone Snowflake proxy uninstallation tasks
  when: not snowflake_enabled | bool
  tags:
    - setup-all
    - setup-snowflake
  block:
    - name: Uninstall the standalone Snowflake proxy
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/uninstall.yml"
