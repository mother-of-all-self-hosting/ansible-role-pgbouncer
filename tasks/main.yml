---
- name: Perform PgBouncer installation tasks
  when: pgbouncer_enabled | bool
  tags:
    - setup-all
    - setup-pgbouncer
    - install-all
    - install-pgbouncer
  block:
    - name: Validate PgBouncer configuration
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/validate_config.yml"
    - name: Install PgBouncer
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/install.yml"

- name: Perform PgBouncer uninstallation tasks
  when: not pgbouncer_enabled | bool
  tags:
    - setup-all
    - setup-pgbouncer
  block:
    - name: Uninstall PgBouncer
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/uninstall.yml"
