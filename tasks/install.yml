---
- name: Ensure PgBouncer path exists
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
    owner: "{{ pgbouncer_uid }}"
    group: "{{ pgbouncer_gid }}"
  with_items:
    - "{{ pgbouncer_base_path }}"

- name: Ensure PgBouncer support file installed
  ansible.builtin.template:
    src: "{{ role_path }}/templates/{{ item }}.j2"
    dest: "{{ pgbouncer_base_path }}/{{ item }}"
    mode: "0640"
    owner: "{{ pgbouncer_uid }}"
    group: "{{ pgbouncer_gid }}"
  with_items:
    - env
  register: pgbouncer_support_files_result

- name: Ensure PgBouncer container image is pulled via community.docker.docker_image_pull
  when: devture_systemd_docker_base_container_image_pull_method == 'ansible-module'
  community.docker.docker_image_pull:
    name: "{{ pgbouncer_container_image }}"
    pull: always
  register: pgbouncer_container_image_pull_result_ansible_module
  retries: "{{ devture_playbook_help_container_retries_count }}"
  delay: "{{ devture_playbook_help_container_retries_delay }}"
  until: pgbouncer_container_image_pull_result_ansible_module is not failed

- name: Ensure PgBouncer container image is pulled via ansible.builtin.command
  when: devture_systemd_docker_base_container_image_pull_method == 'command'
  ansible.builtin.command:
    cmd: "{{ devture_systemd_docker_base_host_command_docker }} pull {{ pgbouncer_container_image }}"
  register: pgbouncer_container_image_pull_result_command
  retries: "{{ devture_playbook_help_container_retries_count }}"
  delay: "{{ devture_playbook_help_container_retries_delay }}"
  until: pgbouncer_container_image_pull_result_command is not failed
  changed_when: "'Downloaded newer image' in pgbouncer_container_image_pull_result_command.stdout"

- name: Ensure PgBouncer container network is created via community.docker.docker_network
  when: devture_systemd_docker_base_container_network_creation_method == 'ansible-module'
  community.docker.docker_network:
    enable_ipv6: "{{ devture_systemd_docker_base_ipv6_enabled }}"
    name: "{{ pgbouncer_container_network }}"
    driver: bridge
    driver_options: "{{ devture_systemd_docker_base_container_networks_driver_options }}"
  register: pgbouncer_network_creation_result

- name: Ensure PgBouncer container network is created via ansible.builtin.command
  when: devture_systemd_docker_base_container_network_creation_method == 'command'
  ansible.builtin.command:
    cmd: >-
      {{ devture_systemd_docker_base_host_command_docker }} network create
      {% if devture_systemd_docker_base_ipv6_enabled %}--ipv6{% endif %}
      {{ devture_systemd_docker_base_container_networks_driver_options_string }}
      {{ pgbouncer_container_network }}
  register: pgbouncer_network_creation_result
  changed_when: pgbouncer_network_creation_result.rc == 0
  failed_when: pgbouncer_network_creation_result.rc != 0 and 'already exists' not in pgbouncer_network_creation_result.stderr

- name: Ensure PgBouncer systemd service is present
  ansible.builtin.template:
    src: "{{ role_path }}/templates/systemd/pgbouncer.service.j2"
    dest: "{{ devture_systemd_docker_base_systemd_path }}/{{ pgbouncer_identifier }}.service"
    mode: "0644"
  register: pgbouncer_systemd_service_result

- name: Determine whether PgBouncer needs a restart
  ansible.builtin.set_fact:
    pgbouncer_restart_necessary: >-
      {{
        pgbouncer_support_files_result.changed | default(false)
        or pgbouncer_systemd_service_result.changed | default(false)
        or pgbouncer_container_image_pull_result_ansible_module.changed | default(false)
        or pgbouncer_container_image_pull_result_command.changed | default(false)
        or pgbouncer_container_image_build_result.changed | default(false)
      }}
