---
- name: Check existence of PgBouncer systemd service
  ansible.builtin.stat:
    path: "{{ devture_systemd_docker_base_systemd_path }}/{{ pgbouncer_identifier }}.service"
  register: pgbouncer_service_stat

- name: Uninstall PgBouncer systemd services and files
  when: pgbouncer_service_stat.stat.exists | bool
  block:
    - name: Ensure PgBouncer systemd service is stopped
      ansible.builtin.service:
        name: "{{ pgbouncer_identifier }}"
        state: stopped
        enabled: false
        daemon_reload: true

    - name: Ensure PgBouncer systemd service does not exist
      ansible.builtin.file:
        path: "{{ devture_systemd_docker_base_systemd_path }}/{{ pgbouncer_identifier }}.service"
        state: absent

    - name: Ensure PgBouncer container network does not exist
      when: pgbouncer_container_network_deletion_enabled
      block:
        - name: Ensure PgBouncer container network does not exist via community.docker.docker_network
          when: devture_systemd_docker_base_container_network_creation_method == 'ansible-module'
          community.docker.docker_network:
            name: "{{ pgbouncer_container_network }}"
            state: absent
          register: pgbouncer_network_deletion_result

        - name: Ensure PgBouncer container network does not exist via ansible.builtin.command
          when: devture_systemd_docker_base_container_network_creation_method == 'command'
          ansible.builtin.command:
            cmd: >-
              {{ devture_systemd_docker_base_host_command_docker }} network rm
              {{ pgbouncer_container_network }}
          register: pgbouncer_network_deletion_result
          changed_when: pgbouncer_container_network in pgbouncer_network_deletion_result.stdout

    - name: Ensure PgBouncer path does not exist
      ansible.builtin.file:
        path: "{{ pgbouncer_base_path }}"
        state: absent
