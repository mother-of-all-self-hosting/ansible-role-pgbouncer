---
- name: Verify PgBouncer systemd service
  hosts: all
  become: true
  gather_facts: false

  vars:
    pgbouncer_verify_units:
      - pgbouncer.service

  tasks:
    - name: Verify that PgBouncer works
      block:
        - name: Wait for the PgBouncer systemd services to become active (up to 180s each)
          ansible.builtin.systemd_service:
            name: "{{ item }}"
          register: pgbouncer_services
          until: pgbouncer_services.status.ActiveState == 'active'
          retries: 36
          delay: 5
          loop: "{{ pgbouncer_verify_units }}"
          # So that giving up is reported by the assertion below rather than as a
          # wall of systemd unit properties.
          failed_when: false

        # `Restart=always` in the systemd unit means that even a container which crashes
        # and gets restarted reads as active here, so this is a precondition rather than
        # a result.
        - name: Assert the PgBouncer systemd services are active
          ansible.builtin.assert:
            that: pgbouncer_services.results | map(attribute='status.ActiveState') | unique | list == ['active']
            fail_msg: >-
              Not every service is active:
              {{ dict(pgbouncer_verify_units | zip(pgbouncer_services.results | map(attribute='status.ActiveState'))) }}
            success_msg: "Every systemd service is active"

        - name: Retrieve the PgBouncer systemd services log for debugging
          when: pgbouncer_debug_service_enabled | bool
          ansible.builtin.command:
            cmd: "journalctl --no-pager --output=cat --unit={{ item }}"
          changed_when: false
          loop: "{{ pgbouncer_verify_units }}"

        - name: Verify nothing was quietly restarting while all of that was being checked
          when: "pgbouncer_restarts_check_enabled | bool"
          block:
            # `Restart=always` means the unit reads `active` while it is crash-looping,
            # so `active` on its own says very little. The window has to be watched with
            # everything already answering.
            - name: Sample the restart counters
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: pgbouncer_restarts_before
              loop: "{{ pgbouncer_verify_units }}"

            # Comfortably longer than the unit's `RestartSec=30`, so a crash loop has to
            # tick at least once inside the window.
            - name: Watch the services for 45 seconds
              ansible.builtin.pause:
                seconds: 45

            - name: Sample the restart counters again
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: pgbouncer_restarts_after
              loop: "{{ pgbouncer_verify_units }}"

            - name: Assert no service restarted while it was up
              ansible.builtin.assert:
                that:
                  - pgbouncer_restarts_after.results | map(attribute='status.NRestarts') | list == pgbouncer_restarts_before.results | map(attribute='status.NRestarts') | list
                  - pgbouncer_restarts_after.results | map(attribute='status.ActiveState') | unique | list == ['active']
                fail_msg: >-
                  A service restarted while it was supposedly up, so `active` was hiding a crash loop.
                  Before:
                  {% for unit, restarts in pgbouncer_verify_units | zip(pgbouncer_restarts_before.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %},
                  after:
                  {% for unit, restarts in pgbouncer_verify_units | zip(pgbouncer_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}
                success_msg: >-
                  None of the services restarted over 45 seconds of watching (restarts so far:
                  {% for unit, restarts in pgbouncer_verify_units | zip(pgbouncer_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %})

        - name: Show PgBouncer verification summary
          ansible.builtin.debug:
            msg:
              - "PgBouncer systemd: {% for unit, state in pgbouncer_verify_units | zip(pgbouncer_services.results | map(attribute='status.ActiveState')) %}{{ unit }} ({{ state }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "PgBouncer restarts: {% for unit, restarts in pgbouncer_verify_units | zip(pgbouncer_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}"

      rescue:
        # Whatever went wrong, the reason is almost always in the systemd service log.
        - name: Retrieve PgBouncer systemd service log
          ansible.builtin.command:
            cmd: journalctl --no-pager --output=cat --unit=pgbouncer.service
          register: pgbouncer_service_log
          changed_when: false

        - name: Show PgBouncer systemd service log
          ansible.builtin.debug:
            var: pgbouncer_service_log.stdout_lines

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "PgBouncer verification failed. The systemd service log is printed above."
