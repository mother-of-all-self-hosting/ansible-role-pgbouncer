---
- name: Verify the standalone Snowflake proxy systemd service
  hosts: all
  become: true
  gather_facts: false

  vars:
    snowflake_verify_units:
      - snowflake.service

  tasks:
    - name: Verify that the standalone Snowflake proxy works
      block:
        - name: Wait for the the standalone Snowflake proxy systemd services to become active (up to 180s each)
          ansible.builtin.systemd_service:
            name: "{{ item }}"
          register: snowflake_services
          until: snowflake_services.status.ActiveState == 'active'
          retries: 36
          delay: 5
          loop: "{{ snowflake_verify_units }}"
          # So that giving up is reported by the assertion below rather than as a
          # wall of systemd unit properties.
          failed_when: false

        # `Restart=always` in the systemd unit means that even a container which crashes
        # and gets restarted reads as active here, so this is a precondition rather than
        # a result.
        - name: Assert the the standalone Snowflake proxy systemd services are active
          ansible.builtin.assert:
            that: snowflake_services.results | map(attribute='status.ActiveState') | unique | list == ['active']
            fail_msg: >-
              Not every service is active:
              {{ dict(snowflake_verify_units | zip(snowflake_services.results | map(attribute='status.ActiveState'))) }}
            success_msg: "Every systemd service is active"

        - name: Retrieve the the standalone Snowflake proxy systemd services log for debugging
          when: snowflake_debug_service_enabled | bool
          ansible.builtin.command:
            cmd: "journalctl --no-pager --output=cat --unit={{ item }}"
          changed_when: false
          loop: "{{ snowflake_verify_units }}"

        - name: Verify nothing was quietly restarting while all of that was being checked
          when: "snowflake_restarts_check_enabled | bool"
          block:
            # `Restart=always` means the unit reads `active` while it is crash-looping,
            # so `active` on its own says very little. The window has to be watched with
            # everything already answering.
            - name: Sample the restart counters
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: snowflake_restarts_before
              loop: "{{ snowflake_verify_units }}"

            # Comfortably longer than the unit's `RestartSec=30`, so a crash loop has to
            # tick at least once inside the window.
            - name: Watch the services for 45 seconds
              ansible.builtin.pause:
                seconds: 45

            - name: Sample the restart counters again
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: snowflake_restarts_after
              loop: "{{ snowflake_verify_units }}"

            - name: Assert no service restarted while it was up
              ansible.builtin.assert:
                that:
                  - snowflake_restarts_after.results | map(attribute='status.NRestarts') | list == snowflake_restarts_before.results | map(attribute='status.NRestarts') | list
                  - snowflake_restarts_after.results | map(attribute='status.ActiveState') | unique | list == ['active']
                fail_msg: >-
                  A service restarted while it was supposedly up, so `active` was hiding a crash loop.
                  Before:
                  {% for unit, restarts in snowflake_verify_units | zip(snowflake_restarts_before.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %},
                  after:
                  {% for unit, restarts in snowflake_verify_units | zip(snowflake_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}
                success_msg: >-
                  None of the services restarted over 45 seconds of watching (restarts so far:
                  {% for unit, restarts in snowflake_verify_units | zip(snowflake_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %})

        - name: Show the standalone Snowflake proxy verification summary
          ansible.builtin.debug:
            msg:
              - "The standalone Snowflake proxy systemd: {% for unit, state in snowflake_verify_units | zip(snowflake_services.results | map(attribute='status.ActiveState')) %}{{ unit }} ({{ state }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "The standalone Snowflake proxy restarts: {% for unit, restarts in snowflake_verify_units | zip(snowflake_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}"

      rescue:
        # Whatever went wrong, the reason is almost always in the systemd service log.
        - name: Retrieve the standalone Snowflake proxy systemd service log
          ansible.builtin.command:
            cmd: journalctl --no-pager --output=cat --unit=snowflake.service
          register: snowflake_service_log
          changed_when: false

        - name: Show the standalone Snowflake proxy systemd service log
          ansible.builtin.debug:
            var: snowflake_service_log.stdout_lines

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "standalone Snowflake proxy verification failed. The systemd service log is printed above."
